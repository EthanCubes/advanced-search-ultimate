<!DOCTYPE html>
<html>
    <head>
        <title>Advanced Search Ultimate</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h2>Contains all of the following:</h2>
        <input type="text" id="all" placeholder="Basically regular search.">

        <br>

        <h2>Contains this specific word/phrase:</h2>
        <input type="text" id="specific" placeholder="Contains specific word/phrase">

        <br>

        <h2>Does not contain:</h2>
        <input type="text" id="none" placeholder="Does not contain">

        <br>

        <h2>Is found on the site:</h2>
        <input type="text" id="site" placeholder="Site or domain name">

        <br>

        <h2 id="optional_toggle">Advanced Options</h2>
        <span id="optional">
            <h2>File Type</h2>
            <select id="file">
                <option value="">All file types</option>
                <option value="pdf">PDF File (.pdf)</option>
                <option value="docx">Microsoft Word document (.docx)</option>
                <option value="pptx">PowerPoint Presentation (.pptx)</option>
                <option value="xlsx">Excel Spreadsheet (.xlsx)</option>
            </select>
            <br>
            <h2>In Title</h2>
            <input type="text" class="shorter" id="title">
            <br>
            <h2>In URL</h2>
            <input type="text" class="shorter" id="url">
            <br>
            <h2>In Text</h2>
            <input type="text" class="shorter" id="text">
        </span>

        <select id="searchEngine">
            <option>DuckDuckGo</option>
            <option>StartPage</option>
            <option>Google</option>
            <option>Bing</option>
            <option>Yahoo</option>
            <option>Ecosia</option>
        </select>

        <br>

        <button id="searchButton">Search!</button>
        <button id="clearButton">Clear All Fields</button>

        <div id="popup">Enter a query to search</div>

        <script src="script.js"></script>
    </body>
</html>
