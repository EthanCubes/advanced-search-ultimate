<!DOCTYPE html>
<html>
    <head>
        <title>Advanced Search Ultimate</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <h2>Contains all of the following (required):</h2>
        <input type="text" id="all" placeholder="Basically regular search.">

        <br>

        <h2>Contains this specific word/phrase:</h2>
        <input type="text" id="specific" placeholder="Contains specific word/phrase">

        <br>

        <h2>Does not contain:</h2>
        <input type="text" id="none" placeholder="Does not contain">

        <br>

        <h2>Is found on the site:</h2>
        <input type="text" id="site" placeholder="Site or domain name">

        <br>

        <h2 id="optional_toggle">Advanced Options</h2>
        <span id="optional">
            <h2>File Type</h2>
            <select id="file">
                <option value="">All file types</option>
                <option value="pdf">Adobe Acrobat Portable Document File (.pdf)</option>
                <option value="docx">Microsoft Office Word File (.docx)</option>
                <option value="pptx">Microsoft Office PowerPoint File (.pptx)</option>
                <option value="xlsx">Microsoft Office Excel File (.xlsx)</option>
            </select>
            <br>
            <h2>In Title</h2>
            <input type="text" id="title">
            <br>
            <h2>In URL</h2>
            <input type="text" id="url">
            <br>
            <h2>In Text</h2>
            <input type="text" id="text">
            <br>
            <h2>Results from after (time)</h2>
            <p class="inline_text">Year</p>
            <input type="text" id="after_year" class="short_form" placeholder="e.g. 2012">
            <p class="inline_text">Month</p>
            <input type="text" id="after_month" class="short_form" placeholder="e.g. 07">
            <p class="inline_text">Day</p>
            <input type="text" id="after_day" class="short_form" placeholder="e.g. 04">
            <br>
            <h2>Results from before (time)</h2>
            <p class="inline_text">Year</p>
            <input type="text" id="before_year" class="short_form" placeholder="e.g. 1984">
            <p class="inline_text">Month</p>
            <input type="text" id="before_month" class="short_form" placeholder="e.g. 04">
            <p class="inline_text">Day</p>
            <input type="text" id="before_day" class="short_form" placeholder="e.g. 02">
        </span>

        <br>

        <select id="searchEngine">
            <option>DuckDuckGo</option>
            <option>StartPage</option>
            <option>Google</option>
            <option>Bing</option>
            <option>Yahoo</option>
            <option>Ecosia</option>
        </select>

        <br><br>

        <button id="searchButton">Search!</button>
        &nbsp;&nbsp;&nbsp;
        <button id="clearButton">Clear All Fields</button>

        <script src="script.js"></script>
    </body>
</html>
